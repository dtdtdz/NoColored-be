version: '3.8'

services:
  back:
    env_file:
    - .env
    build:
      context: "./backend"
      dockerfile: Dockerfile 
    ports:
      - "8080:8080"
    networks:
      - deploy
    container_name: be
    depends_on:
      - mariadb
      - redis
      - mongodb

  mariadb:
    image: mariadb:11.8.2
    container_name: ${MARIA_HOST}
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIA_PWD}
      MYSQL_DATABASE: ${MARIA_DB}
      MYSQL_USER: ${MARIA_USER}
      MYSQL_PASSWORD: ${MARIA_USER_PWD}

    ports:
      - "${MARIA_LOCAL}:3306"
    networks:
      - deploy
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: ${REDIS_HOST}
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - deploy
    command: ["redis-server", "--requirepass", "${REDIS_PWD}"]

  mongodb:
    image: mongo:6
    container_name: ${MONGO_HOST}
    restart: always
    ports:
      - "${MONGO_PORT}:27017"
    networks:
      - deploy
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PWD}
networks:
  deploy:

volumes:
  mariadb_data:
  mongodb_data:
